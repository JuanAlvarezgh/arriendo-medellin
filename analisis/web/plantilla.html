<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arriendos en Medellín</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
__ESTILO_MAPLIBRE__
</style>

<style>
/* El mapa ocupa toda la pantalla y lo demás flota encima en vidrio, como en el
   mapa de consumo de EPM: un panel a la izquierda con lo justo para leerlo,
   las capas al lado y el zoom abajo a la derecha. Nada de cifras de informe. */

:root {
  color-scheme: light;
  --fondo:   #f4efe6;
  --papel:   #eae2d5;
  --tarjeta: #ffffff;
  --tinta:   #262320;
  --tinta-2: #5f584e;
  --tinta-3: #928a7d;
  --linea:   #e2d9ca;
  --linea-2: #cbbfac;
  --acento:  #b0603a;
  --acento-tenue: rgba(176, 96, 58, .12);
  --acento-borde: rgba(176, 96, 58, .34);
  --caro:    #d03b3b;
  --barato:  #2a78d6;
  --neutro:  #eae2d5;
  --sin-datos: #b9ae9b;
  --vidrio: rgba(255, 255, 255, .7);
  --vidrio-borde: rgba(255, 255, 255, .55);
  --vidrio-sombra: 0 12px 38px -14px rgba(60, 45, 30, .35), 0 2px 10px -4px rgba(60, 45, 30, .18);
  --alto-sitio: 52px;
}
:root:not([data-tema="claro"]) {
  @media (prefers-color-scheme: dark) {
    color-scheme: dark;
    --fondo:   #131210;
    --papel:   #1b1917;
    --tarjeta: #1f1c19;
    --tinta:   #f2ede4;
    --tinta-2: #b8b0a3;
    --tinta-3: #857d70;
    --linea:   #2a2622;
    --linea-2: #3a342d;
    --acento:  #d98a5f;
    --acento-tenue: rgba(217, 138, 95, .16);
    --acento-borde: rgba(217, 138, 95, .38);
    --caro:    #e05252;
    --barato:  #3987e5;
    --neutro:  #3a342d;
    --sin-datos: #5b5346;
    --vidrio: rgba(27, 25, 23, .72);
    --vidrio-borde: rgba(255, 255, 255, .08);
    --vidrio-sombra: 0 16px 44px -14px rgba(0, 0, 0, .65), 0 2px 10px -4px rgba(0, 0, 0, .5);
  }
}
:root[data-tema="oscuro"] {
  color-scheme: dark;
  --fondo:   #131210;
  --papel:   #1b1917;
  --tarjeta: #1f1c19;
  --tinta:   #f2ede4;
  --tinta-2: #b8b0a3;
  --tinta-3: #857d70;
  --linea:   #2a2622;
  --linea-2: #3a342d;
  --acento:  #d98a5f;
  --acento-tenue: rgba(217, 138, 95, .16);
  --acento-borde: rgba(217, 138, 95, .38);
  --caro:    #e05252;
  --barato:  #3987e5;
  --neutro:  #3a342d;
  --sin-datos: #5b5346;
  --vidrio: rgba(27, 25, 23, .72);
  --vidrio-borde: rgba(255, 255, 255, .08);
  --vidrio-sombra: 0 16px 44px -14px rgba(0, 0, 0, .65), 0 2px 10px -4px rgba(0, 0, 0, .5);
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--fondo); color: var(--tinta); overflow: hidden;
  font: 14px/1.55 Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
}

.app { position: relative; height: calc(100vh - var(--alto-sitio)); height: calc(100dvh - var(--alto-sitio)); overflow: hidden; }
#mapa { position: absolute; inset: 0; background: var(--papel); }
.maplibregl-map { font: inherit; }
.maplibregl-ctrl-attrib { background: var(--vidrio) !important; color: var(--tinta-3) !important; border-radius: 8px 0 0 0 !important; }
.maplibregl-ctrl-attrib a { color: var(--tinta-2) !important; }
.maplibregl-ctrl-attrib-button { display: none; }

.vidrio {
  background: var(--vidrio);
  backdrop-filter: saturate(180%) blur(22px); -webkit-backdrop-filter: saturate(180%) blur(22px);
  border: 1px solid var(--vidrio-borde); box-shadow: var(--vidrio-sombra);
}

/* ── panel ─────────────────────────────────────────────────── */
.panel {
  position: absolute; z-index: 1000; top: 18px; left: 18px; bottom: 18px; width: 340px;
  max-width: calc(100vw - 36px); border-radius: 24px; padding: 22px;
  display: flex; flex-direction: column; gap: 22px; overflow-y: auto;
}
.panel-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.marca { display: flex; align-items: center; gap: 9px; font-size: 11px; letter-spacing: .13em;
         text-transform: uppercase; color: var(--tinta-3); }
.marca i { width: 22px; height: 3px; background: var(--acento); border-radius: 2px; }
h1 { font: 600 25px/1.15 Fraunces, Georgia, serif; margin: 8px 0 0; letter-spacing: -.01em; }
.intro { margin: 12px 0 0; color: var(--tinta-2); font-size: 13.5px; }
.intro b { color: var(--tinta); font-weight: 600; }

.rotulo { font-size: 10.5px; letter-spacing: .11em; text-transform: uppercase; color: var(--tinta-3);
          margin: 0 0 9px; font-weight: 600; }
.rampa { display: flex; gap: 3px; }
.rampa div { flex: 1; height: 12px; border-radius: 5px; }
.rampa-pies { display: flex; justify-content: space-between; color: var(--tinta-3); font-size: 11px; margin-top: 5px; }
.lista { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 5px; }
.lista li { display: flex; align-items: center; gap: 9px; font-size: 12.5px; color: var(--tinta-2); }
.punto { width: 11px; height: 11px; border-radius: 50%; flex-shrink: 0; }
.extra { margin-top: 10px; }
.nota { color: var(--tinta-3); font-size: 12px; margin: 10px 0 0; }

.acciones { display: flex; flex-direction: column; gap: 9px; }
.acciones a {
  display: flex; align-items: center; justify-content: space-between; gap: 10px; text-decoration: none;
  padding: 13px 16px; border-radius: 14px; font-size: 14px; font-weight: 600;
  background: var(--tarjeta); color: var(--tinta); border: 1px solid var(--linea-2);
}
.acciones a.principal { background: var(--acento-tenue); color: var(--acento); border-color: var(--acento-borde); }
.acciones a:hover { border-color: var(--acento); }
.acciones a span { opacity: .7; }
.buscar-barrio { display: flex; gap: 6px; }
.buscar-barrio input { flex: 1; min-width: 0; font: inherit; font-size: 14px; padding: 12px 14px; border-radius: 14px;
                       border: 1px solid var(--linea-2); background: var(--tarjeta); color: var(--tinta); }
.buscar-barrio button { appearance: none; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
                        padding: 0 16px; border-radius: 14px; border: 1px solid var(--acento); background: var(--acento); color: #fff; }
.buscar-barrio input:focus-visible, .buscar-barrio button:focus-visible { outline: 2px solid var(--acento); outline-offset: 2px; }
.fuente { color: var(--tinta-3); font-size: 11px; margin: auto 0 0; }
.opacidad { display: flex; align-items: center; gap: 10px; margin-top: 16px; font-size: 12px; color: var(--tinta-2); }
.opacidad input { flex: 1; min-width: 0; accent-color: var(--acento); }
.opacidad span { width: 38px; text-align: right; font-variant-numeric: tabular-nums; color: var(--tinta-3); }

.icono {
  width: 34px; height: 34px; padding: 0; border-radius: 50%; flex-shrink: 0; cursor: pointer;
  display: grid; place-items: center; background: var(--tarjeta); border: 1px solid var(--linea-2); color: var(--tinta-2);
}
.icono svg { width: 17px; height: 17px; }
.icono .sol { display: none; }
:root[data-tema="oscuro"] .icono .luna { display: none; }
:root[data-tema="oscuro"] .icono .sol { display: block; }
:root:not([data-tema="claro"]) { @media (prefers-color-scheme: dark) {
  .icono .luna { display: none; } .icono .sol { display: block; } } }

/* ── capas: a la derecha del panel, que si no se las comería ── */
.capas {
  position: absolute; z-index: 999; left: 376px; top: 18px;
  display: flex; flex-direction: column; gap: 8px; align-items: stretch; width: 210px;
}
.capas button {
  appearance: none; font: inherit; font-size: 12.5px; text-align: left; cursor: pointer;
  padding: 10px 14px; border-radius: 12px; color: var(--tinta);
}
.capas button:hover { border-color: var(--acento); }
.capas button[aria-pressed="true"] { background: var(--acento); border-color: var(--acento); color: #fff; }
.capas button:focus-visible, .zoom button:focus-visible, .icono:focus-visible, .acciones a:focus-visible {
  outline: 2px solid var(--acento); outline-offset: 2px; }

/* ── zoom ─────────────────────────────────────────────────── */
.zoom { position: absolute; z-index: 999; right: 18px; bottom: 30px; display: flex; flex-direction: column;
        gap: 8px; align-items: flex-end; }
.zoom button {
  appearance: none; font: inherit; cursor: pointer; color: var(--tinta);
  width: 44px; height: 44px; border-radius: 50%; font-size: 18px; display: grid; place-items: center;
}
.zoom button.todo { width: auto; height: auto; border-radius: 999px; padding: 10px 16px; font-size: 12px; }

/* ── globo al pasar sobre un punto ─────────────────────────── */
.globo {
  position: absolute; z-index: 1001; pointer-events: none; border-radius: 14px; padding: 10px 12px;
  font-size: 12px; max-width: 260px; opacity: 0; transition: opacity .08s;
}
.globo.visible { opacity: 1; }
.globo .tit { font-weight: 600; margin-bottom: 4px; }
.globo .sub { color: var(--tinta-3); margin: -2px 0 6px; }
.globo dl { margin: 0; display: grid; grid-template-columns: auto auto; gap: 2px 12px; }
.globo dt { color: var(--tinta-2); }
.globo dd { margin: 0; font-variant-numeric: tabular-nums; text-align: right; }
.globo .aviso { margin-top: 7px; padding-top: 7px; border-top: 1px solid var(--linea); color: var(--tinta-2); }
.globo .fija { font-size: 10.5px; color: var(--acento); margin-left: 6px; text-transform: uppercase; letter-spacing: .08em; }

@media (max-width: 980px) {
  .capas { left: auto; right: 18px; width: 190px; }
}
@media (max-width: 720px) {
  .panel { top: auto; left: 0; right: 0; bottom: 0; width: auto; max-width: none; max-height: 46%;
           border-radius: 22px 22px 0 0; gap: 16px; padding: 18px 18px max(18px, env(safe-area-inset-bottom)); }
  .capas { left: 12px; right: 12px; top: 12px; width: auto; flex-direction: row; overflow-x: auto; }
  .capas button { white-space: nowrap; flex-shrink: 0; }
  .zoom { right: 12px; bottom: auto; top: 64px; }
  .zoom button.todo { display: none; }
}
</style>
</head>
<body>
__ENCABEZADO__

<div class="app">
  <div id="mapa" role="application" aria-label="Mapa de Medellín con un punto por aviso de arriendo o por manzana del censo"></div>

  <aside class="panel vidrio">
    <div>
      <div class="panel-top">
        <div class="marca"><i></i>Arriendos · Medellín</div>
        <button id="tema" class="icono" type="button" aria-label="Cambiar entre claro y oscuro" title="Cambiar entre claro y oscuro">
          <svg class="luna" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 14.6A9 9 0 1 1 9.4 3.2a7 7 0 0 0 11.4 11.4Z"/></svg>
          <svg class="sol" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.4M12 19.1v2.4M4.6 4.6l1.7 1.7M17.7 17.7l1.7 1.7M2.5 12h2.4M19.1 12h2.4M4.6 19.4l1.7-1.7M17.7 6.3l1.7-1.7"/></svg>
        </button>
      </div>
      <h1 id="titulo">El arriendo en Medellín, aviso por aviso</h1>
      <p class="intro" id="intro"></p>
    </div>

    <div>
      <p class="rotulo" id="leyenda-titulo"></p>
      <div id="leyenda"></div>
      <p class="nota" id="leyenda-nota"></p>
      <label class="opacidad">Opacidad de los puntos
        <input type="range" id="opacidad" min="10" max="100" step="5" value="80">
        <span id="opacidad-valor">80 %</span>
      </label>
    </div>

    <div class="acciones">
      <a class="principal" href="consulta_arriendos.html#buscar">Buscar arriendo <span>→</span></a>
      <form class="buscar-barrio" id="buscar-barrio" role="search" autocomplete="off">
        <input id="barrio-buscado" list="lista-barrios" placeholder="Buscar un barrio en el mapa"
               aria-label="Buscar un barrio en el mapa">
        <button type="submit" aria-label="Ir al barrio">Ir</button>
      </form>
      <datalist id="lista-barrios"></datalist>
      <p class="nota" id="barrio-nota" hidden></p>
    </div>

    <p class="fuente">Avisos de portales inmobiliarios. Manzanas y viviendas: censo del DANE.
      Son precios pedidos, no pactados.</p>
  </aside>

  <div class="capas" role="group" aria-label="Qué muestra el mapa">
    <button class="vidrio" data-capa="precio" aria-pressed="true">Precio por m²</button>
    <button class="vidrio" data-capa="sobreprecio" aria-pressed="false">Caro por la ubicación</button>
    <button class="vidrio" data-capa="conglomerado" aria-pressed="false">Zonas caras y baratas</button>
    <button class="vidrio" data-capa="cobertura" aria-pressed="false">Dónde no se anuncia</button>
    <button class="vidrio" data-capa="viviendas" aria-pressed="false">Viviendas del censo</button>
  </div>

  <div class="zoom">
    <button class="vidrio" id="mas" type="button" title="Acercar" aria-label="Acercar">+</button>
    <button class="vidrio" id="menos" type="button" title="Alejar" aria-label="Alejar">−</button>
    <button class="vidrio todo" id="todo" type="button">Toda la ciudad</button>
  </div>

  <div class="globo vidrio" id="globo" role="status"></div>
</div>
